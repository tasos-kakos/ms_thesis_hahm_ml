name: env_ms_hahm_thesis
channels:
  - conda-forge
  - defaults
dependencies:
  # Base Python and scientific stack (compiled via conda)
  - python=3.11
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - h5py
  - pillow
  - joblib
  - root=6.36.04
  - pyyaml
  - pip

  # Pip packages
  - pip:
      - tensorflow==2.20.0
      - keras==3.11.3
      - hls4ml==1.1.0
      - tqdm==4.67.1
      - rich==14.2.0


